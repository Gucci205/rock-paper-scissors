<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="icon" href="./assets/rock-paper-scissors.png" type="image/x-icon">   <!--favicon icon-->
    <!-- Font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
    <!-- Font Awesome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- Bootstrap link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- CSS link -->
    <link rel="stylesheet" href="./style/loading-screen.css">
    <link rel="stylesheet" href="./style/game-intro.css">
    <link rel="stylesheet" href="./style/main.css">
</head>
<body>
    <audio src="./assets/theme-song.mp3" id="themeSong"></audio>

    <!-- <i class="fa-solid fa-volume-xmark mute-btn"></i> -->

    <div id="loadingScreen">
        <div class="first-container d-flex flex-column align-items-center">
            <div class="img-box">
                <img class="img-fluid loading-rock" src="./assets/fist.png" alt="rockImg" />
                <img class="img-fluid loading-paper" src="./assets/stop (1).png" alt="paperImg" />
                <img class="img-fluid loading-scissors" src="./assets/v (1).png" alt="scissorsImg" />
            </div>
            <div class="txt-box">
                <h1 class="display-4 m-0 rock">ROCK</h1>
                <h1 class="display-4 m-0 paper">PAPER</h1>
                <h1 class="display-4 m-0 scissors">SCISSORS</h1>
            </div>
        </div>
        
        <div class="second-container">
            <h4 class="text-white text-center mb-3">Loading...</h4>
            <div class="dots">
                <div class="loadingScreen-rock-circle"></div>
                <div class="loadingScreen-paper-circle"></div>
                <div class="loadingScreen-scissors-circle"></div>
            </div>
        </div>
    </div>


    <div id="introScreen">
        <header class="mt-3">
            <div class="container">
                <div class="row justify-content-center align-items-center">
                    <div class="col-lg-2 text-center p-0">
                        <h1 class="display-4 m-0 rock">ROCK</h1>
                    </div>
                    <div class="col-lg-2 text-center p-0">
                        <h1 class="display-4 m-0 paper">PAPER</h1>
                    </div>
                    <div class="col-lg-2 text-center p-0">
                        <h1 class="display-4 m-0 scissors">SCISSORS</h1>
                    </div>
                </div>
                <div class="row text-center mt-3">
                    <h4 class="text-secondary">--- PICK YOUR MOVE ---</h4>
                </div>
            </div>
        </header>

        <main class="my-5 d-flex justify-content-center align-items-center">
            <div class="circle my-5">
                <div class="rock-img">
                    <img class="img img-fluid" src="" alt="rockImg">
                </div>
                <div class="rock-circle"></div>
                <div class="paper-img">
                    <img class="img img-fluid" src="" alt="paperImg">
                </div>
                <div class="paper-circle"></div>
                <div class="scissors-img">
                    <img class="img img-fluid" src="" alt="scissorsImg">
                </div>
                <div class="scissors-circle"></div>
            </div>
        </main>

        <footer>
            <div class="container d-flex justify-content-center align-items-center">
                <div class="row justify-content-center">
                    <div class="col">
                        <div>
                            <button id="startBtn" type="button" class="btn fs-4 px-4 py-1">START GAME</button>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <div id="gameContainer">
        <i class="fa-solid fa-volume-xmark mute-btn"></i>
        <!-- header section -->
        <header class="header-section pt-4">
            <div class="container">
                <div class="row justify-content-center align-items-center">
                    <div class="col-lg-6 col-md-8 col-sm-6 col-6">
                        <div>
                            <h1 class="display-5 m-0 rock">ROCK</h1>
                            <h1 class="display-5 m-0 paper">PAPER</h1>
                            <h1 class="display-5 m-0 scissors">SCISSORS</h1>
                        </div>
                    </div>
                    <div class="col-lg-6 col-md-4 col-sm-6 col-6 text-center d-flex justify-content-end">
                        <div class="scoreDisplay">
                            <h6 id="computerScore" class="text-white rounded px-3 py-1">Computer : <p class="comScore m-0 d-inline-block">0</p></h6>
                            <h6 id="playerScore" class="text-white rounded px-3 py-1 mb-0">Player : <span class="plaScore m-0 d-inline-block">0</span></h6>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- play section -->
        <main class="play-section">
            <div class="container">
                <div class="row justify-content-center text-center align-items-center">
                    <div class="col-lg-3 col-md-4 col-sm-5 col-5">
                        <div id="computer">
                            <div class="d-flex justify-content-center mb-2">
                                <h4 class="py-1 rounded-3">Computer</h4>
                            </div>
                            <div id="computer-move" class="rounded-3 d-flex align-items-center justify-content-center">
                                <img src="./assets/fist.png" class="img-fluid" id="comImg" alt="">
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-9 col-10">
                        <div>
                            <p id="statement" class="py-2 rounded-3">READY ?</p>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-4 col-sm-5 col-5">
                        <div id="player">
                            <div class="d-flex justify-content-center mb-2">
                                <h4 class="py-1 rounded-3">Player</h4>
                            </div>
                            <div id="player-move" class="rounded-3 d-flex align-items-center justify-content-center">
                                <img src="./assets/fist.png" class="img-fluid" id="playerImg" alt="">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- player section -->
        <section class="player-section">
            <div class="container d-flex justify-content-center">
                <div class="row text-center justify-content-evenly">
                    <div class="col-3">
                        <div class="yourMove">
                            <button type="button" class="btn play-btn rock-btn">
                                <img src="" alt="rockImg" class="img-fluid img" />
                            </button>
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="yourMove">
                            <button type="button" class="btn play-btn paper-btn">
                                <img src="" alt="paperImg" class="img-fluid img" />
                            </button>
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="yourMove">
                            <button type="button" class="btn play-btn scissors-btn">
                                <img src="" alt="scissorsImg" class="img-fluid img" />
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- reset section -->
        <section class="reset-section mt-5">
            <div class="container d-flex justify-content-center">
                <div class="row">
                    <div class="col">
                        <div>
                            <button id="resetBtn" type="button" class="btn py-1 px-1">
                                RESET SCORES !
                            </button> 
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- footer -->
        <footer class="footer">
            <div class="container">
                <div class="row">
                    <div class="col">
                        <hr />
                        <div>
                            <div class="main-div">
                                <p class="text-dark m-0 text-center">&copy;<span id="yearTxt"></span> All rights reserved</p>
                                <div class="child-div text-center">
                                    <p class="text-secondary text-decoration-none d-inline-block">
                                        Privacy Policy
                                    </p>
                                    <span class="mx-1 text-secondary">|</span>
                                    <p href="javascript:void(0)" class="text-secondary text-decoration-none d-inline-block">
                                        Terms of Service
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    
    <!-- script js -->
    <script src="./app.js"></script>
</body>
</html>
